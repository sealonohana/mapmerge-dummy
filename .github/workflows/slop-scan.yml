name: slop-scan

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # slop-detector is a private repo, and public repos cannot `uses:` private
      # actions - so install the CLI from it instead, via a fine-grained PAT
      # (contents: read on sealonohana/slop-detector) stored as SLOP_DETECTOR_TOKEN.
      - name: Install slop-detector
        env:
          TOKEN: ${{ secrets.SLOP_DETECTOR_TOKEN }}
        run: pip install --quiet "git+https://x-access-token:${TOKEN}@github.com/sealonohana/slop-detector.git@main"

      - name: Scan this repo's published advisories
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VULNSLOP_LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          vulnslop --scan-repo "$GITHUB_REPOSITORY" --fail-on never --json > vulnslop-report.json
          code=$?
          set -e
          python -m vulnslop.gha vulnslop-report.json
          # 2 = repo publishes no advisories: fine. 3 = fail-on tripped.
          if [ "$code" = "0" ] || [ "$code" = "2" ]; then exit 0; fi
          exit "$code"
